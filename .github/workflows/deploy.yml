name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test the rules engine
        run: |
          npm ci
          npm test
      - name: Rebuild web/core.js from src/core
        run: npm run build:core
      - name: Validate the browser game
        run: |
          node --check web/game.js
          node --check web/core.js
          node --check web/cage-editor.js
          node --check web/cage-layout.js
          node --check web/assets/sprites.js
          python tools/check_web.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
